<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>

 <section id="conteiner">

    <h1>Algo vai acontecer em breve...</h1>

    <p id="timer"></p>



 </section>

 <section class="timer">

    <div class="box">
        <span id="days">00</span>
        <p>Dias</p>
    </div>

    <div class="box">
        <span id="hours">00</span>
        <p>Horas</p>
    </div>

    <div class="box">
        <span id="minutes">00</span>
        <p>Min</p>
    </div>

    <div class="box">
        <span id="seconds">00</span>
        <p>Seg</p>
    </div>
    

 <script src="Projeto.js"></script>
</body>
</html>
