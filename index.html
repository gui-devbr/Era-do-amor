   <body>

    <section id="conteiner">
        <h1>Algo vai acontecer em breve...</h1>
        
        <p id="timer"></p>

        <div class="timer">
            <div class="box"><span id="days">00</span><p>Dias</p></div>
            <div class="box"><span id="hours">00</span><p>Horas</p></div>
            <div class="box"><span id="minutes">00</span><p>Min</p></div>
            <div class="box"><span id="seconds">00</span><p>Seg</p></div>
        </div> 

        <button onclick="iniciartransmissao()">✨ Iniciar transmissão</button>
    </section>

    <div id="viagem-tempo">
